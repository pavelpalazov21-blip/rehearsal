name: Core source checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Unit tests
        run: npm run test:unit
      - name: Build production source
        run: npm run build
      - name: Verify the read-only Git export points to the built revision
        run: |
          test -s dist/client/release-source/git/refs/heads/main
          test "$(cat dist/client/release-source/git/refs/heads/main)" = "$(git rev-parse HEAD)"
